# 只写与主题默认值不同的设置，升级主题时不必修改 node_modules。
# 文档：https://butterfly.js.org/posts/4aa8abbe/
menu:
  主页: / || fas fa-home
  博文||fas fa-book:
    分类: /categories/ || fas fa-folder-open
    标签: /tags/ || fas fa-tags
    归档: /archives/ || fas fa-archive
  关于: /about/ || fas fa-user

# 首页标题下的短句。更换个人简介时也可修改这里。
subtitle:
  enable: true
  effect: false
  source: false
  sub: 记录笔记与思考

# 与参考站一样使用交替排列的文章卡片。
index_layout: 3
index_post_content:
  method: 2 # 优先显示文章 description，没有时自动截取正文
  length: 160

# 深色阅读风格；右下角仍可切换明暗。
display_mode: dark
darkmode:
  enable: true
  button: true
  autoChangeMode: false
enter_transitions: false # 由下面的轻量动画控制，避免重复入场
index_top_img_height: 360px

# 以后把背景放入 source/img/，再填写 /img/你的背景.jpg。
background:
index_img:

avatar:
  img: /img/avatar.svg
  effect: false
favicon: /img/avatar.svg

cover:
  index_enable: true
  aside_enable: false
  archives_enable: true
  default_cover: /img/covers/notes.svg

theme_color:
  enable: true
  main: '#95baa8'
  button_hover: '#769e8a'
  link_color: '#95baa8'
  text_selection: '#537762'
  paginator: '#769e8a'
  scrollbar_color: '#637d6f'

code_blocks:
  theme: darker
  macStyle: true
  height_limit: 400

social: {}
share:
  use:

aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: 记录笔记与思考
    button:
      enable: false # 确定 GitHub 账号后再填写链接并启用
  card_announcement:
    enable: false
  card_recent_post:
    enable: false
  card_categories:
    enable: true
  card_tags:
    enable: true
  card_archives:
    enable: false
  card_webinfo:
    enable: true
    last_push_date: false

search:
  use: local_search
  placeholder: 搜索文章...

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

translate:
  enable: false

# 不加载第三方访问统计；网站信息保留文章数与字数。
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

footer:
  owner:
    enable: true
    since: 2026

inject:
  head:
    - <link rel="stylesheet" href="/css/journal.css">
  bottom:
    - <script src="/js/journal.js" defer></script>
