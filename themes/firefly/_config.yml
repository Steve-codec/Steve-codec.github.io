# ============================================================
#  Firefly Theme for Hexo - 完整配置文件
#  从 Astro 版 Firefly 迁移至 Hexo
#  本文件合并了原 Astro 项目中 28 个 TypeScript 配置文件的全部内容
# ============================================================
asset_version: '20261007-shelves1'

# ============================================================
#  主题色彩设置 (对应模板中 theme.theme_color.*)
# ============================================================
theme_color:
  hue: 165
  fixed: false
  default_mode: dark

# ============================================================
#  导航栏设置 (对应模板中 theme.nav.*)
# ============================================================
nav:
  sticky: true
  transparent: true
  type: default
  logo:
    type: image
    value: /img/avatar.png
    alt: 博客头像
  title: Time machine
  show_menu: true
  menu:
    - name: 首页
      icon: home
      path: /
    - name: 归档
      icon: archive
      path: /archives/
    - name: 分类
      icon: category
      path: /categories/
    - name: 标签
      icon: tag
      path: /tags/
    - name: 关于
      icon: user
      path: /about/
  follow_theme: false
  links:
    - name: 生活
      icon: auto_awesome
      url: /gallery/
      children:
        - name: 相册
          icon: photo_library
          url: /gallery/
        - name: 追番
          icon: movie
          url: /bangumi/
        - name: 留言板
          icon: forum
          url: /guestbook/

# ============================================================
#  卡片样式 (对应模板中 theme.cards.*)
# ============================================================
cards:
  border: true
  follow_theme_hue: false

# ============================================================
#  页面内容最大宽度，单位：rem
# ============================================================
page_width: 100

# ============================================================
#  Favicon 设置 (对应模板中 theme.favicon.*)
# ============================================================
favicon:
  favicon_16: /img/avatar.png
  favicon_32: /img/avatar.png
  apple_touch_icon: /img/avatar.png
  favicon_svg: ''
  manifest: ''
  mask_icon: ''
  mask_icon_color: ''

# ============================================================
#  独立页面配置 (对应模板中 theme.pages.*)
# ============================================================
pages:
  dynamic: true
  friends: true
  sponsor: false
  guestbook: true
  bangumi: true
  gallery: true

# ============================================================
#  文章分类栏 (对应模板中 theme.category_bar.*)
# ============================================================
category_bar:
  enable: false

# ============================================================
#  文章设置 (对应模板中 theme.post.*)
# ============================================================
post:
  default_index_img: /img/covers/notes.svg
  show_cover: true
  meta:
    author:
      enable: true
    date:
      enable: true
      format: YYYY-MM-DD
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 200
      language: zh-CN
    tag:
      enable: true
    category:
      enable: true
  toc:
    enable: true
    placement: right
    floating: true
  category_bar:
    enable: false
    placement: left
  copyright:
    enable: true
    license: CC BY-NC-SA 4.0
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  share:
    enable: true
    twitter: true
    facebook: false
    weibo: false
  prev_next:
    enable: true
  related:
    enable: true
    maxCount: 6
  updated:
    enable: true
    date_format: YYYY-MM-DD HH:mm

# ============================================================
#  文章列表布局 (对应模板中 theme.post_list_layout.*)
# ============================================================
post_list_layout:
  default_mode: list
  mobile_default_mode: list
  date_format: YYYY-MM-DD
  show_tags: true
  show_category: true
  show_reading_time: true
  description_lines: 2
  allow_switch: true
  grid:
    masonry: false
    column_width: 320

# ============================================================
#  社交链接 (对应模板中 theme.social.*)
# ============================================================
social:
  - name: GitHub
    icon: github
    url: https://github.com/Steve-codec
  - name: Bilibili（待设置）
    icon: bilibili
    url: https://www.bilibili.com/
  - name: 留言板
    icon: mail
    url: /guestbook/
  - name: RSS
    icon: rss_feed
    url: /atom.xml

# ============================================================
#  导航栏 Logo (对应模板中 theme.logo.*)
# ============================================================
logo:
  url: /img/avatar.png
  icon: ''

# ============================================================
#  首页文字 (对应模板中 theme.home_text.*，banner.ejs 读取)
# ============================================================
home_text:
  title: Time machine
  subtitle:
    - 记录笔记与思考
    - 把一闪而过的想法，慢慢写下来
  typewriter:
    enable: true
    speed: 100
    delete_speed: 50
    pause_time: 2000

# ============================================================
#  版权许可 (对应模板中 theme.license.*)
# ============================================================
license:
  name: CC BY-NC-SA 4.0
  url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# ============================================================
#  侧边栏组件列表 (对应模板中 theme.widgets)
#  模板通过 widgets.forEach 遍历加载 widget partials
# ============================================================
widgets:
  - type: profile
    enable: true
    position: left
  - type: announcement
    enable: true
    position: left
  - type: music
    enable: true
    position: left
  - type: categories
    enable: true
    position: left
  - type: tags
    enable: true
    position: left
  - type: dynamic
    enable: true
    position: right
  - type: stats
    enable: true
    position: right
  - type: calendar
    enable: true
    position: right
  - type: site-info
    enable: true
    position: right

# ============================================================
#  广告 (对应模板中 theme.advertisement.*)
# ============================================================
advertisement:
  enable: false
  title: ''
  content: ''

# ============================================================
#  归档页、分类页、标签页、首页额外配置
# ============================================================
archive:
  description: ''

category: {}

tag: {}

index:
  show_title: false

# ============================================================
#  站点基本设置 (siteConfig.ts 其余部分)
# ============================================================
site:
  title: Time machine
  subtitle: 记录笔记与思考
  site_url: https://steve-codec.github.io
  description: 记录笔记与思考
  keywords:
    - Firefly
    - Hexo
    - 博客
    - 技术博客
    - 静态博客
  lang: zh-CN
  site_start_date: '2026-09-25'
  timezone: Asia/Shanghai
  show_last_modified: true
  outdated_threshold: 30
  rehype_callouts_theme: github
  pagination:
    posts_per_page: 10

# ============================================================
#  统计分析设置
# ============================================================
analytics:
  busuanzi: true
  google_analytics_id: ''
  microsoft_clarity_id: ''
  umami:
    website_id: ''
    script_url: https://cloud.umami.is/script.js
  bai_du_tong_ji_id: ''
  la51:
    id: ''
    autoTrack: false
    screenRecord: true

# ============================================================
#  个人资料设置 (profileConfig.ts)
# ============================================================
profile:
  avatar: /img/avatar.png
  # 裁切焦点：横向、纵向百分比。纵向越小，越能保留原图上方。
  avatar_position: '50% 15%'
  # 放大倍数；1 为原始裁切，1.15 为轻微放大。
  avatar_zoom: 1.15
  name: Hugh
  bio: 记录笔记与思考
  links:
    - name: GitHub
      icon: github
      url: https://github.com/Steve-codec
    - name: Bilibili（待设置）
      icon: bilibili
      url: https://www.bilibili.com/
    - name: 留言板
      icon: mail
      url: /guestbook/
    - name: RSS
      icon: rss_feed
      url: /atom.xml

# ============================================================
#  壁纸/背景设置 (backgroundWallpaper.ts)
#  这是原 Astro 配置中最复杂的部分，包含约 80 个字段
# ============================================================
wallpaper:
  mode: banner
  switchable: false
  src:
    - desktop: /img/banner.jpg
      mobile: /img/banner.jpg
      alt: Time machine 背景
  dim_opacity: 0.45
  banner_switch_interval: 5000
  enable_carousel: false
  show_scroll_down: true
  scroll_down_text: 向下阅读
  common:
    dim_opacity: 0.45
    home_text:
      enable: true
      switchable: true
      title: Time machine
      title_size: 3.8rem
      subtitle:
        - 记录笔记与思考
        - 把一闪而过的想法，慢慢写下来
      subtitle_size: 1.5rem
      typewriter:
        enable: true
        speed: 100
        delete_speed: 50
        pause_time: 2000
    navbar:
      transparent_mode: semi
      enable_blur: true
      blur: 5
    waves:
      enable:
        desktop: true
        mobile: true
      switchable: true
    gradient:
      enable:
        desktop: true
        mobile: true
      height: 15vh
      switchable: true
  banner:
    position: 0% 20%
    carousel:
      enable: false
      interval: 5000
      switchable: false
  overlay:
    switchable:
      opacity: true
      blur: true
      card_opacity: true
    z_index: -1
    opacity: 0.8
    blur: 10
    card_opacity: 0.5
  fullscreen:
    position: center

# ============================================================
#  评论系统设置 (commentConfig.ts)
# ============================================================
comments:
  type: giscus
  giscus:
    repo: ''
    repo_id: ''
    category: Announcements
    category_id: ''
    mapping: pathname
    strict: '0'
    reactions_enabled: '1'
    emit_metadata: '1'
    input_position: top
    lang: zh-CN
    loading: lazy
  twikoo:
    env_id: ''
    lang: zh-CN
  waline:
    server_url: ''
    lang: zh-CN
    emoji: []
  artalk:
    server: ''
    locale: zh-CN
  disqus:
    shortname: ''

# ============================================================
#  PJAX 无刷新跳转 (保证切换页面时音乐连续播放)
# ============================================================
pjax:
  enable: false

# ============================================================
#  音乐播放器设置 (musicConfig.ts)
# ============================================================
music:
  mode: local
  volume: 0.7
  play_mode: list
  show_lyrics: true
  show_in_navbar: true
  meting: null
  local:
    playlist: []

# ============================================================
#  侧边栏设置 (sidebarConfig.ts)
# ============================================================
sidebar:
  enable: true
  position: both
  tablet_sidebar: left
  show_both_sidebars_on_post: true
  left_components:
    - type: profile
      enable: true
      position: top
      show_on_post: true
    - type: announcement
      enable: true
      position: top
      show_on_post: true
    - type: music
      enable: true
      position: sticky
      show_on_post: true
    - type: categories
      enable: true
      position: sticky
      show_on_post: true
      collapse_threshold: 5
    - type: tags
      enable: true
      position: sticky
      show_on_post: true
      collapse_threshold: 10
  right_components:
    - type: stats
      enable: true
      position: top
      show_on_post: true
    - type: calendar
      enable: true
      position: sticky
      show_on_post: false
    - type: sidebar_toc
      enable: true
      position: sticky
      show_on_post: true
      show_on_non_post: false
  mobile_bottom_components:
    - type: profile
      enable: true
    - type: music
      enable: true
    - type: dynamic
      enable: true
    - type: stats
      enable: true
    - type: tags
      enable: true
    - type: site-info
      enable: true

# ============================================================
#  特效设置
# ============================================================
effects:
  sakura:
    enable: true
    switchable: true
    num: 21
    limit_times: -1
    size:
      min: 0.4
      max: 0.7
    opacity:
      min: 0.3
      max: 0.8
    speed:
      horizontal:
        min: 0.1
        max: 0.3
      vertical:
        min: 0.5
        max: 1.5
      rotation: 0.01
      fade_speed: 0.01
    z_index: 999

# ============================================================
#  看板娘/角色模型设置 (pio)
# ============================================================
pio:
  spine:
    enable: false
    model:
      path: /pio/models/spine/firefly/1310.json
    position:
      corner: bottom-right
    size:
      width: 220
      height: 310
  live2d:
    enable: false
    model:
      path: /pio/models/live2d/snow_miku/model.json
    position: left

# ============================================================
#  页脚设置
# ============================================================
footer:
  enable: true
  powered_by: true
  visitor_counter: true
  beian:
    enable: false
    icp: ''
    icp_url: https://beian.miit.gov.cn/
    gongan: ''
    gongan_icon: ''
    gongan_url: ''
  custom_html: ''
  custom: ''
  theme_author: firefly-theme
  license:
    enable: true
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# ============================================================
#  代码块设置
# ============================================================
code:
  highlight: false
  theme_dark: one-dark-pro
  theme_light: one-light
  theme: github-dark
  collapsible:
    enable: true
    line_threshold: 15
    preview_lines: 5
    default_collapsed: false
  language_badge:
    enable: true

# ============================================================
#  PlantUML 图表设置
# ============================================================
plantuml:
  enable: false
  server: https://www.plantuml.com/plantuml
  light_theme: ''
  dark_theme: ''

# ============================================================
#  搜索设置（本地搜索，替代原 Astro 的 PageFind）
# ============================================================
search:
  enable: true
  path: /local-search.xml

# ============================================================
#  公告设置
# ============================================================
announcement:
  title: 欢迎来到我的小屋
  content: '🛖'
  icon: campaign
  type: info
  closable: true

# ============================================================
#  字体设置
# ============================================================
font:
  enable: false
  urls: []
  selected: []
  fonts: {}
  preload: false

iconfont: ''

# ============================================================
#  赞助页面设置
# ============================================================
sponsor:
  description: 感谢你的支持，让这间小屋继续生长。
  methods: []
  sponsors: []

# ============================================================
#  相册设置
# ============================================================
gallery:
  albums: []
  column_width: 240

# ============================================================
#  友链页面设置
# ============================================================
friends_page:
  randomize_sort: false
  show_comment: false
  show_custom_content: false

# ============================================================
#  图片优化（仅作参考，Hexo 中不启用）
# ============================================================
image_optimization:
  no_referrer_domains: []

# ============================================================
#  数学渲染 (KaTeX / MathJax)
# ============================================================
math:
  engine: ''

# ============================================================
#  Mermaid 图表
# ============================================================
mermaid:
  enable: false

# ============================================================
#  Fancybox 图片灯箱
# ============================================================
fancybox: true
